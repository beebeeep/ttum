[package]
name = "ttum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
imap = "2.4.1"
imap-proto = "0.10.2"
mail-parser = "0.11.9"
native-tls = "0.2.18"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
ratatui-textarea = "0.9.2"
rfc2047-decoder = "1.1.2"
rusqlite = "0.40.2"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
url = "2.5.8"
utf7-imap = "0.3.2"
